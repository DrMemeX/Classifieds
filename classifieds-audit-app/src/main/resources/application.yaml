spring:
  application:
    name: classifieds-audit-app

  datasource:
    url: jdbc:postgresql://localhost:6767/classifieds_audit
    username: ${AUDIT_POSTGRES_USER}
    password: ${AUDIT_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092